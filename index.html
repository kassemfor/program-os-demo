// On first load, inject sample data into localStorage that the iframe will read
function seedSampleData() {
  const existing = localStorage.getItem(PROD_KEY);
  if (existing && !sessionStorage.getItem('demo_seeded')) {
    // User has their own data — don't overwrite
    return;
  }
  const sample = loadSampleData();
  localStorage.setItem(PROD_KEY, JSON.stringify(sample));
  sessionStorage.setItem('demo_seeded', '1');
}

// Reset to fresh sample data
function resetDemo() {
  if (!confirm('Reset to fresh sample data? Any changes you made will be lost.')) return;
  sessionStorage.removeItem('demo_seeded');
  localStorage.removeItem(PROD_KEY);
  const sample = loadSampleData();
  localStorage.setItem(PROD_KEY, JSON.stringify(sample));
  sessionStorage.setItem('demo_seeded', '1');
  document.getElementById('os-frame').contentWindow.location.reload();
}

// Inject sample data before the iframe loads
